<text x="159" y="245" font-size="10" fill="#a83e2c">1</text>
<rect x="150" y="248" width="3.8" height="9" rx="4" fill="#56633f"/>
<text x="159" y="256" font-size="10" fill="#56633f">1</text>
<text x="24" y="272" font-size="12" font-weight="600" fill="#201e1d">color-4</text>
<rect x="150" y="263" width="3.8" height="9" rx="4" fill="#a83e2c"/>
<text x="159" y="271" font-size="10" fill="#a83e2c">1</text>
<rect x="150" y="274" width="3.8" height="9" rx="4" fill="#56633f"/>
<text x="159" y="282" font-size="10" fill="#56633f">1</text>
<text x="24" y="298" font-size="12" font-weight="600" fill="#201e1d">white</text>
<rect x="150" y="289" width="34.6" height="9" rx="4" fill="#a83e2c"/>
<text x="190" y="297" font-size="10" fill="#a83e2c">9</text>
<rect x="150" y="300" width="3.8" height="9" rx="4" fill="#56633f"/>
<text x="159" y="308" font-size="10" fill="#56633f">1</text>
<text x="150" y="332" font-size="10" fill="#645c50">red = before, green = after. The one remaining item on each light theme is the SandiBumi wordmark,</text>
<text x="150" y="346" font-size="10" fill="#645c50">which WCAG 1.4.3 exempts as a logotype and which this repo forbids re-colouring. Dark is clean.</text>
<text x="24" y="380" font-size="13" font-weight="700" fill="#201e1d">B. The primary button label, at rest / hover / press</text>
<text x="24" y="396" font-size="11" fill="#645c50">The terracotta fill is untouched &#8212; only the label moved, from white to the theme&#8217;s ink.</text>
<text x="24" y="454" font-size="12" font-weight="600" fill="#201e1d">light</text>
<rect x="120" y="440" width="106" height="22" rx="11" fill="#c67139"/>
<text x="173" y="455" font-size="10" font-weight="600" fill="#201e1d" text-anchor="middle">rest</text>
<text x="232" y="449" font-size="10" fill="#a83e2c">3.61</text>
<text x="232" y="461" font-size="10" font-weight="700" fill="#56633f">&#8594; 4.60</text>
<rect x="370" y="440" width="106" height="22" rx="11" fill="#c67139"/>
<text x="423" y="455" font-size="10" font-weight="600" fill="#201e1d" text-anchor="middle">hover</text>
<text x="482" y="449" font-size="10" fill="#a83e2c">4.26</text>
<text x="482" y="461" font-size="10" font-weight="700" fill="#56633f">&#8594; 5.53</text>
<rect x="620" y="440" width="106" height="22" rx="11" fill="#c67139"/>
<text x="673" y="455" font-size="10" font-weight="600" fill="#201e1d" text-anchor="middle">press</text>
<text x="732" y="449" font-size="10" fill="#a83e2c">6.81</text>
<text x="732" y="461" font-size="10" font-weight="700" fill="#56633f">&#8594; 8.03</text>
<text x="24" y="484" font-size="12" font-weight="600" fill="#201e1d">dark</text>
<rect x="120" y="470" width="106" height="22" rx="11" fill="#d98c3f"/>
<text x="173" y="485" font-size="10" font-weight="600" fill="#201e1d" text-anchor="middle">rest</text>
<text x="232" y="479" font-size="10" fill="#a83e2c">2.70</text>
<text x="232" y="491" font-size="10" font-weight="700" fill="#56633f">&#8594; 6.15</text>
<rect x="370" y="470" width="106" height="22" rx="11" fill="#d98c3f"/>
<text x="423" y="485" font-size="10" font-weight="600" fill="#201e1d" text-anchor="middle">hover</text>
<text x="482" y="479" font-size="10" fill="#a83e2c">3.07</text>
<text x="482" y="491" font-size="10" font-weight="700" fill="#56633f">&#8594; 8.03</text>
<rect x="620" y="470" width="106" height="22" rx="11" fill="#d98c3f"/>
<text x="673" y="485" font-size="10" font-weight="600" fill="#201e1d" text-anchor="middle">press</text>
<text x="732" y="479" font-size="10" fill="#a83e2c">4.34</text>
<text x="732" y="491" font-size="10" font-weight="700" fill="#56633f">&#8594; 10.97</text>
<text x="24" y="536" font-size="13" font-weight="700" fill="#201e1d">C. Secondary text on the default theme</text>
<text x="24" y="552" font-size="11" fill="#645c50">--text-dim was neutral-600, one ramp step lighter than every other theme in the app puts it. Now neutral-700.</text>
<text x="44" y="582" font-size="11" fill="#201e1d">on white panel</text>
<text x="220" y="582" font-size="11" fill="#a83e2c">4.29</text>
<text x="270" y="582" font-size="11" font-weight="700" fill="#56633f">&#8594; 6.59</text>
<text x="44" y="602" font-size="11" fill="#201e1d">on cream ribbon</text>
<text x="220" y="602" font-size="11" fill="#a83e2c">3.61</text>
<text x="270" y="602" font-size="11" font-weight="700" fill="#56633f">&#8594; 5.53</text>
<text x="44" y="622" font-size="11" fill="#201e1d">on the alt ground</text>
<text x="220" y="622" font-size="11" fill="#a83e2c">3.55</text>
<text x="270" y="622" font-size="11" font-weight="700" fill="#56633f">&#8594; 5.44</text>
<text x="24" y="656" font-size="13" font-weight="700" fill="#201e1d">D. Measured, and deliberately not changed</text>
<text x="44" y="673" font-size="10.5" fill="#645c50">• The SandiBumi wordmark, 3.03:1 on the cream ribbon — a logotype, exempt under WCAG 1.4.3, and --brand is declared once and never re-rolled.</text>
<text x="44" y="690" font-size="10.5" fill="#645c50">• Panel header buttons (＋ ⬌ ⬍ ▢ ⧉ ✕) are 22×18 px, under the 24×24 of WCAG 2.5.8. Enlarging them changes dock geometry, and dense data UI is a product decision.</text>
<text x="24" y="670" font-size="10" fill="#645c50">Scope: 100 text-bearing elements and 72 focusable controls actually mounted in the default workspace (Wells, Tops, Processing,</text>
<text x="24" y="684" font-size="10" fill="#645c50">Performance, Log View, Inspector, Equation Editor, ribbon) at 1280&#215;720, with layout also checked at 1366&#215;768 and 1024&#215;640.</text>
</svg>