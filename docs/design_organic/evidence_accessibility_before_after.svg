<rect x="150" y="185" width="30.8" height="9" rx="4" fill="#a83e2c"/>
<text x="186" y="193" font-size="10" fill="#a83e2c">8</text>
<rect x="150" y="196" width="3.8" height="9" rx="4" fill="#56633f"/>
<text x="159" y="204" font-size="10" fill="#56633f">1</text>
<text x="24" y="220" font-size="12" font-weight="600" fill="#201e1d">color-2</text>
<rect x="150" y="211" width="3.8" height="9" rx="4" fill="#a83e2c"/>
<text x="159" y="219" font-size="10" fill="#a83e2c">1</text>
<rect x="150" y="222" width="3.8" height="9" rx="4" fill="#56633f"/>
<text x="159" y="230" font-size="10" fill="#56633f">1</text>
<text x="24" y="246" font-size="12" font-weight="600" fill="#201e1d">color-3</text>
