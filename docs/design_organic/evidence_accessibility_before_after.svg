<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Figtree, Segoe UI, system-ui, sans-serif">
<rect width="900" height="700" fill="#f5ead8"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#201e1d">Accessibility pass: before and after</text>
<text x="24" y="54" font-size="11" fill="#645c50">Measured in the running app across all seven themes, with CSS transitions frozen. WCAG AA needs 4.5:1 for text, 3:1 for a control&#8217;s edge.</text>
<text x="24" y="88" font-size="13" font-weight="700" fill="#201e1d">A. Text below 4.5:1, per theme</text>
<text x="330" y="88" font-size="11" fill="#645c50">101 total &#8594; 6, and all six left are the same item</text>
<text x="24" y="142" font-size="12" font-weight="600" fill="#201e1d">light</text>
<rect x="150" y="133" width="300.0" height="9" rx="4" fill="#a83e2c"/>
<text x="456" y="141" font-size="10" fill="#a83e2c">78</text>
<rect x="150" y="144" width="3.8" height="9" rx="4" fill="#56633f"/>
<text x="159" y="152" font-size="10" fill="#56633f">1</text>
