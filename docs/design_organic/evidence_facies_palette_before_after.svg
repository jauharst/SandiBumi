<text x="479" y="140" font-size="8" fill="#645c50" text-anchor="middle">11</text>
<text x="90" y="158" font-size="10" font-weight="700" fill="#a83e2c">facies 2 and 3 are the SAME colour to a red-green colour-blind reader (&#916;E 0.7)</text>
