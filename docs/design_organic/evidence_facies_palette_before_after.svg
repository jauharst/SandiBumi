<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Figtree, Segoe UI, system-ui, sans-serif">
<rect width="900" height="660" fill="#f5ead8"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#201e1d">Facies palette: before and after</text>
<text x="24" y="54" font-size="11" fill="#645c50">Measured with the dataviz skill&#8217;s validator. Two facies are safely distinct at CVD &#916;E &#8805; 8 and normal-vision &#916;E &#8805; 15.</text>
<text x="24" y="86" font-size="13" font-weight="700" fill="#201e1d">The twelve slots, in order. A run with K classes shows slots 0..K&#8722;1 &#8212; boxed here is the default K = 5.</text>
<text x="24" y="120" font-size="11" font-weight="600" fill="#645c50">before</text>
<rect x="90" y="102" width="30" height="26" rx="4" fill="#4e79a7" stroke="#201e1d" stroke-width="1.5"/>
