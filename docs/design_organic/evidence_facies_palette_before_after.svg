<text x="190" y="336" font-size="11" fill="#56633f">21.6</text>
<text x="300" y="336" font-size="11" fill="#56633f">20.1</text>
<text x="420" y="336" font-size="11" fill="#56633f">29.4</text>
<text x="40" y="356" font-size="11" fill="#201e1d">4</text>
<text x="90" y="356" font-size="11" fill="#a83e2c">0.7</text>
<text x="190" y="356" font-size="11" fill="#56633f">14.6</text>
<text x="300" y="356" font-size="11" fill="#a83e2c">14.6</text>
<text x="420" y="356" font-size="11" fill="#56633f">20.2</text>
<text x="40" y="376" font-size="11" fill="#201e1d" font-weight="700">5</text>
<text x="90" y="376" font-size="11" fill="#a83e2c" font-weight="700">0.7</text>
<text x="190" y="376" font-size="11" fill="#56633f" font-weight="700">8.5</text>
<text x="300" y="376" font-size="11" fill="#a83e2c" font-weight="700">12.8</text>
<text x="420" y="376" font-size="11" fill="#56633f" font-weight="700">15.0</text>
<text x="500" y="376" font-size="10" font-weight="700" fill="#201e1d">&#8592; the default K: both gates now met</text>
<text x="40" y="396" font-size="11" fill="#201e1d">6</text>
<text x="90" y="396" font-size="11" fill="#a83e2c">0.7</text>
<text x="190" y="396" font-size="11" fill="#56633f">8.5</text>
<text x="300" y="396" font-size="11" fill="#a83e2c">12.8</text>
<text x="420" y="396" font-size="11" fill="#a83e2c">13.9</text>
<text x="40" y="416" font-size="11" fill="#201e1d">7</text>
<text x="90" y="416" font-size="11" fill="#a83e2c">0.7</text>
<text x="190" y="416" font-size="11" fill="#a83e2c">5.6</text>
<text x="300" y="416" font-size="11" fill="#a83e2c">12.8</text>
<text x="420" y="416" font-size="11" fill="#a83e2c">12.0</text>
<text x="500" y="416" font-size="10" fill="#645c50">past here no palette can separate every pair &#8212;</text>
<text x="40" y="436" font-size="11" fill="#201e1d">8</text>
<text x="90" y="436" font-size="11" fill="#a83e2c">0.7</text>
<text x="190" y="436" font-size="11" fill="#a83e2c">4.9</text>
<text x="300" y="436" font-size="11" fill="#a83e2c">12.8</text>
<text x="420" y="436" font-size="11" fill="#a83e2c">10.3</text>
<text x="500" y="436" font-size="10" fill="#645c50">twelve distinguishable hues do not exist, so a high-K</text>
<text x="40" y="456" font-size="11" fill="#201e1d">9</text>
<text x="90" y="456" font-size="11" fill="#a83e2c">0.7</text>
<text x="190" y="456" font-size="11" fill="#a83e2c">4.8</text>
<text x="300" y="456" font-size="11" fill="#a83e2c">10.3</text>
<text x="420" y="456" font-size="11" fill="#a83e2c">7.8</text>
<text x="500" y="456" font-size="10" fill="#645c50">scheme needs class labels, not a better palette.</text>
<text x="40" y="476" font-size="11" fill="#201e1d">10</text>
<text x="90" y="476" font-size="11" fill="#a83e2c">0.7</text>
<text x="190" y="476" font-size="11" fill="#a83e2c">1.9</text>
<text x="300" y="476" font-size="11" fill="#a83e2c">10.3</text>
<text x="420" y="476" font-size="11" fill="#a83e2c">6.2</text>
<text x="40" y="496" font-size="11" fill="#201e1d">11</text>
<text x="90" y="496" font-size="11" fill="#a83e2c">0.7</text>
<text x="190" y="496" font-size="11" fill="#a83e2c">1.8</text>
<text x="300" y="496" font-size="11" fill="#a83e2c">2.4</text>
<text x="420" y="496" font-size="11" fill="#a83e2c">6.2</text>
<text x="40" y="516" font-size="11" fill="#201e1d">12</text>
<text x="90" y="516" font-size="11" fill="#a83e2c">0.7</text>
<text x="190" y="516" font-size="11" fill="#a83e2c">1.6</text>
<text x="300" y="516" font-size="11" fill="#a83e2c">2.4</text>
<text x="420" y="516" font-size="11" fill="#a83e2c">6.2</text>
<text x="24" y="630" font-size="10" fill="#645c50">Same twelve slots as before except two: #e15759 (collided with the green at &#916;E 0.7 under deuteranopia) and #86bcb6 (a near-duplicate of #76b7b2</text>
<text x="24" y="644" font-size="10" fill="#645c50">at &#916;E 2.4 for normal vision) gave way to #2a78d6 and #e34948, both documented values. Screen and print carry the identical list, enforced by a test.</text>
</svg>