<text x="105" y="218" font-size="8" fill="#645c50" text-anchor="middle">0</text>
<rect x="124" y="180" width="30" height="26" rx="4" fill="#2a78d6" stroke="#201e1d" stroke-width="1.5"/>
<text x="139" y="218" font-size="8" fill="#645c50" text-anchor="middle">1</text>
