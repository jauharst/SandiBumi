<text x="309" y="140" font-size="8" fill="#645c50" text-anchor="middle">6</text>
<rect x="328" y="102" width="30" height="26" rx="4" fill="#ff9da7" stroke="#dcd3c4" stroke-width="0.6"/>
<text x="343" y="140" font-size="8" fill="#645c50" text-anchor="middle">7</text>
