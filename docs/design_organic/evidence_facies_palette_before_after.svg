<rect x="328" y="180" width="30" height="26" rx="4" fill="#9c755f" stroke="#dcd3c4" stroke-width="0.6"/>
<text x="343" y="218" font-size="8" fill="#645c50" text-anchor="middle">7</text>
<rect x="362" y="180" width="30" height="26" rx="4" fill="#4e79a7" stroke="#dcd3c4" stroke-width="0.6"/>
<text x="377" y="218" font-size="8" fill="#645c50" text-anchor="middle">8</text>
<rect x="396" y="180" width="30" height="26" rx="4" fill="#d37295" stroke="#dcd3c4" stroke-width="0.6"/>
