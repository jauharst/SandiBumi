<text x="479" y="218" font-size="8" fill="#645c50" text-anchor="middle">11</text>
<text x="90" y="236" font-size="10" font-weight="700" fill="#56633f">every pair in the default set is separable (worst &#916;E 8.5) &#8212; and facies 0, the cleanest rock, reads as sand</text>
<text x="24" y="276" font-size="13" font-weight="700" fill="#201e1d">Worst pair inside the first K colours</text>
<text x="330" y="276" font-size="10" fill="#645c50">two colours changed: the red that collided with green, and a duplicate teal</text>
<text x="40" y="296" font-size="10" font-weight="700" fill="#645c50">K</text>
<text x="90" y="296" font-size="10" font-weight="700" fill="#645c50">before CVD</text>
<text x="190" y="296" font-size="10" font-weight="700" fill="#645c50">after CVD</text>
<text x="300" y="296" font-size="10" font-weight="700" fill="#645c50">before normal</text>
<text x="420" y="296" font-size="10" font-weight="700" fill="#645c50">after normal</text>
<text x="40" y="316" font-size="11" fill="#201e1d">2</text>
<text x="90" y="316" font-size="11" fill="#56633f">23.0</text>
<text x="190" y="316" font-size="11" fill="#56633f">37.0</text>
