[package]
name = "sandibumi"
version = "0.1.0"
description = "Petrophysical Software Engine — multi-well log analysis (Tauri + DuckDB + WebGPU)"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sandibumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Phase 1+ engine dependencies (see CLAUDE.md for the rules governing their use) ---
duckdb = { version = "1", features = ["bundled"] }
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
bytemuck = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1"
thiserror = "2"
base64 = "0.22"
rhai = { version = "1", features = ["sync"] }
sha2 = "0.10"

# Windows resource metrics for the Health Monitor panel (system memory load, per-process
# USER/GDI object counts, total CPU load via GetSystemTimes). Version matches the one Tauri
# already pulls in (0.61), so this only widens features — no second copy of the crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# Size/speed-optimized shipping builds (Tauri's recommended profile). Dev builds and
# `cargo check` are unaffected. Most of the binary is the bundled DuckDB engine —
# link-time optimization + symbol stripping claw a large share of that back.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

